name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Verify production HTTP responses
        run: |
          docker run --rm -v "$PWD/nginx.conf:/etc/nginx/nginx.conf:ro" nginx:alpine nginx -t
          docker run -d --rm --name caustic-http -p 4174:80 -v "$PWD/nginx.conf:/etc/nginx/nginx.conf:ro" -v "$PWD/dist:/usr/share/nginx/html:ro" nginx:alpine
          trap 'docker rm -f caustic-http' EXIT
          curl --retry 10 --retry-all-errors --retry-delay 1 --retry-max-time 30 --fail http://127.0.0.1:4174/health
          npm run verify:site -- http://127.0.0.1:4174/
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
